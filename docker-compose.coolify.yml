services:
  app:
    image: ghcr.io/activepieces/activepieces:0.92.1
    restart: unless-stopped
    expose:
      - '80'
    environment:
      AP_CONTAINER_TYPE: APP
      AP_EDITION: ce
      AP_ENVIRONMENT: prod
      AP_FRONTEND_URL: ${AP_FRONTEND_URL:?}
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY:?}
      AP_JWT_SECRET: ${AP_JWT_SECRET:?}
      AP_DB_TYPE: POSTGRES
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: '5432'
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_USERNAME: activepieces
      AP_POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD:?}
      AP_REDIS_TYPE: STANDALONE
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: '6379'
      AP_REDIS_PASSWORD: ${AP_REDIS_PASSWORD:?}
      AP_FILE_STORAGE_LOCATION: DB
      AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
      AP_ALLOW_OPEN_SIGN_UP: 'false'
      AP_TELEMETRY_ENABLED: 'false'
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_cache:/usr/src/app/cache
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:80/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  worker:
    image: ghcr.io/activepieces/activepieces:0.92.1
    restart: unless-stopped
    environment:
      AP_CONTAINER_TYPE: WORKER
      AP_ENVIRONMENT: prod
      AP_FRONTEND_URL: http://app
      AP_WORKER_TOKEN: ${AP_WORKER_TOKEN:?}
      AP_WORKER_CONCURRENCY: '1'
      AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
      AP_REUSE_SANDBOX: 'true'
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - worker_cache:/usr/src/app/cache
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:80/worker/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  postgres:
    image: pgvector/pgvector:0.8.0-pg14
    restart: unless-stopped
    environment:
      POSTGRES_DB: activepieces
      POSTGRES_USER: activepieces
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${AP_REDIS_PASSWORD:?}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  app_cache:
  worker_cache:
  postgres_data:
  redis_data:
